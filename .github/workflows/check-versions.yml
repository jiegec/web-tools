name: Check for new app releases

on:
  schedule:
    # Every Monday at 03:23 UTC (11:23 in Asia/Shanghai). GitHub may delay it
    # slightly at busy times, hence the odd minute.
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: check-versions
  cancel-in-progress: false

jobs:
  check:
    name: Check versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve the latest versions
        id: versions
        run: bash scripts/check-versions.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit the updated versions
        if: steps.versions.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "Update app versions" \
            -m "$(jq -r '.apps | to_entries | map("\(.key) \(.value.version)") | join(", ")' versions.json)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # A push made with GITHUB_TOKEN does not trigger other workflows, so ask
      # for the deployment explicitly at the commit that was just pushed.
      - name: Trigger the deployment
        if: steps.versions.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "versions.json"
      - "index.html"
      - "favicon.svg"
      - "scripts/build-site.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build site from the pinned versions
        run: bash scripts/build-site.sh dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Keep .nojekyll: harmless with Actions-based Pages, and it makes the
          # artifact correct if the site is ever served by the legacy Jekyll build.
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
